name: churn-imbalanced-dataset

on: [push]

permissions: write-all

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (for CML)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run training script
        run: |
          python script.py

      - name: Generate and post report with CML
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Créer le rapport Markdown
          echo "# 📊 Rapport d'entraînement du modèle" > report.md
          echo "" >> report.md
          
          echo "## 📈 Métriques" >> report.md
          echo '```' >> report.md
          cat metrics.txt >> report.md
          echo '```' >> report.md
          echo "" >> report.md
          
          echo "## 🖼️ Matrice de confusion" >> report.md
          cml publish conf_matrix.png --md >> report.md
          echo "" >> report.md
          
          echo "## 🔧 Informations techniques" >> report.md
          echo "- Date d'exécution: $(date '+%Y-%m-%d %H:%M:%S')" >> report.md
          echo "- Commit: ${{ github.sha }}" >> report.md
          echo "- Auteur: ${{ github.actor }}" >> report.md
          
          # Publier le commentaire sur GitHub (Pull Request ou Commit)
          cml comment create report.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-artifacts
          path: |
            metrics.txt
            conf_matrix.png
          retention-days: 30
